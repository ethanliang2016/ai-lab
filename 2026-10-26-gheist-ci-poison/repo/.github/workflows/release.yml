name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: python -m build
      - name: Publish to registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "publishing with token of length ${#NPM_TOKEN}"
